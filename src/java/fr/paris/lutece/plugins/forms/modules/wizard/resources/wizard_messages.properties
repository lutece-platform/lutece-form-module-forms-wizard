# Module keys
module.provider=City Of Paris
module.description=Wizard to create a form step by step

pageTitle=Form creation wizard
manageForms.buttonWizard=Create with the wizard

# Wizard frame
wizard.heading=Create a form
wizard.labelStep=Step
wizard.labelOf=of
wizard.buttonPrevious=Previous
wizard.buttonContinue=Continue
wizard.buttonCreate=Create the form
wizard.labelProgress=Progress of the wizard

# Screen 1
formInfo.title=Form information
formInfo.intro=Give the form a title and choose how it is presented. Every other setting can be changed later in the form parameters.

# Screen 2
structure.title=Structure
structure.intro=Will the form be filled in on a single page or in several steps?
structure.labelSingle=Single step
structure.labelSingle.help=All the questions on one page: the step is both the first and the last step of the form.
structure.labelMulti=Multiple steps
structure.labelMulti.help=The questions are spread over several steps: a first step, a last step and, if needed, intermediate steps.

# Screen 3
steps.title=Steps
steps.intro=Describe the steps of the form. You will add the questions in the forms builder once the form is created.
steps.introTemplate=Each step can start empty or from a step template that already holds questions.
steps.sectionSingle=The step
steps.sectionFirst=First step
steps.sectionIntermediate=Intermediate steps
steps.sectionLast=Last step
steps.labelStepTitle=Title
steps.labelStepDescription=Description
steps.labelIntermediate=Intermediate step
steps.labelType=Content
steps.labelTypeEmpty=Empty step
steps.labelTypeTemplate=From a template
steps.labelTemplate=Step template
steps.labelTemplate.help=The step takes the name and the questions of the template.
steps.noIntermediate=No intermediate step: the first step leads directly to the last one.
steps.buttonAddIntermediate=Add an intermediate step
steps.buttonMoveUp=Move up
steps.buttonMoveDown=Move down

# Screen 4
summary.title=Summary
summary.intro=Check the form before creating it. Once it is created, the forms builder opens so that you can add your questions.
summary.labelStructure=Structure
summary.labelEndMessage=End message
summary.labelEndMessageHidden=Not displayed
summary.labelNoDate=Not set
summary.labelSteps=Steps
summary.labelFromTemplate=From the template
summary.labelInitial=First
summary.labelFinal=Last

# Messages
message.error.structure=Choose a single step or a multiple steps form.
message.error.firstStepTitle=The title of the first step is mandatory.
message.error.lastStepTitle=The title of the last step is mandatory.
message.error.intermediateStepTitle=The title of the intermediate step {0} is mandatory.
message.error.stepTitleSize=The title of a step cannot exceed 255 characters.
message.error.stepDescriptionSize=The description of a step cannot exceed 255 characters.
message.error.templateNotFound=The template chosen for "{0}" no longer exists.
message.error.creation=The form could not be created. Nothing has been saved.
message.error.access=The workgroup or the access control chosen is no longer available to you. Choose them again.
message.info.formCreated=The form has been created. Add its questions in the builder.
